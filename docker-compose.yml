name: asimbv-website

services:
  # --- Database: PostgreSQL 16 ---
  postgres:
    image: postgres:16-alpine
    container_name: asimbv-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-asimbv_db}
      POSTGRES_USER: ${POSTGRES_USER:-asimbv_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-asimbv_secret_password_2026}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-asimbv_user} -d ${POSTGRES_DB:-asimbv_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Database Management Web UI: Adminer ---
  adminer:
    image: adminer:latest
    container_name: asimbv-adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy

  # --- Backend: ASP.NET Core (.NET 8) Web API ---
  aspnet-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: asimbv-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5197}:5197"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ASPNETCORE_URLS=http://+:5197
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB:-asimbv_db};Username=${POSTGRES_USER:-asimbv_user};Password=${POSTGRES_PASSWORD:-asimbv_secret_password_2026}
    depends_on:
      postgres:
        condition: service_healthy

  # --- Frontend: React 19 + Vite Dev Server ---
  react-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: asimbv-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      - VITE_BACKEND_URL=http://aspnet-backend:5197
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - aspnet-backend

volumes:
  # Persistent volume for PostgreSQL database storage
  postgres_data:
